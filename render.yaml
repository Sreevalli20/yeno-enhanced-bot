services:
  - type: web
    name: yeno-enhanced-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python yeno_competition_starter_bot.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://frontend-bpg3.vercel.app
    healthCheckPath: /health
